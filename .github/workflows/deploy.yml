name: Deploy

# Production deploys on every push to main, and every night so the "Trending now" section stays
# fresh. Publishes reviewed and checked books only. Draft books can be previewed locally with
# `npm run build:preview`.
#
# Required once: repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and HARDCOVER_TOKEN,
# and repository variables CLOUDFLARE_PAGES_PROJECT and SITE_URL. See docs/deployment.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip until the repository variables exist so a fresh fork does not fail.
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Refresh trending books from Hardcover
        # If the API is down or the token is missing, the committed snapshot is used instead.
        continue-on-error: true
        run: node scripts/refresh-trending.js
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
      - run: npm run validate
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply book-finder --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish
        run: npx wrangler pages deploy dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
